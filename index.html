<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VODAR — Website Under Construction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-primary: #F0303F;
      --brand-primary-dark: #C41A27;
      --brand-primary-light: #FF6B76;
      --brand-primary-tint: #FFF0F1;

      --text-primary: #1A1A2E;
      --text-secondary: #4A4A5A;
      --text-muted: #8A8A9A;

      --bg-light: #F5F5F7;
      --border-light: #E8E8EC;
      --shadow-brand: rgba(240, 48, 63, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      color: var(--text-primary);
      background:
        radial-gradient(1200px 600px at 100% -10%, rgba(240,48,63,0.06), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(240,48,63,0.05), transparent 60%),
        #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---------- 顶部导航 ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
      padding: 16px 48px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .logo img {
      height: 34px;
      width: auto;
      display: block;
    }

    /* ---------- 主体 ---------- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 24px;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(34px, 6vw, 60px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 18px;
    }
    h1 .accent {
      color: var(--brand-primary);
    }

    /* ---------- 加载动画 ---------- */
    .bars {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 44px;
      margin-bottom: 40px;
    }
    .bars span {
      width: 6px;
      border-radius: 3px;
      background: var(--brand-primary);
      animation: bar 1.2s ease-in-out infinite;
    }
    .bars span:nth-child(1) { height: 40%; animation-delay: 0s; }
    .bars span:nth-child(2) { height: 100%; animation-delay: .15s; }
    .bars span:nth-child(3) { height: 65%; animation-delay: .3s; }
    .bars span:nth-child(4) { height: 100%; animation-delay: .45s; }
    .bars span:nth-child(5) { height: 40%; animation-delay: .6s; }
    @keyframes bar {
      0%, 100% { transform: scaleY(1); opacity: .4; }
      50% { transform: scaleY(1.5); opacity: 1; }
    }

    /* ---------- 留言表单 ---------- */
    .contact {
      width: 100%;
      max-width: 460px;
    }
    .contact h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 22px;
    }
    .field { margin-bottom: 16px; text-align: left; }
    .field label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .field input, .field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: var(--text-primary);
      background: #fff;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input:focus, .field textarea:focus {
      outline: none;
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px var(--shadow-brand);
    }
    .field textarea {
      min-height: 110px;
      resize: vertical;
    }
    .btn-send {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--brand-primary);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .3px;
      cursor: pointer;
      transition: background .2s, opacity .2s;
    }
    .btn-send:hover { background: var(--brand-primary-dark); }
    .btn-send:disabled { opacity: .6; cursor: wait; }
    .form-status {
      font-size: 14px;
      margin-top: 12px;
      min-height: 20px;
    }
    .form-status.success { color: #16a34a; }
    .form-status.error { color: var(--brand-primary); }

    /* ---------- 页脚 ---------- */
    footer {
      text-align: center;
      padding: 32px 24px;
      color: var(--text-muted);
      font-size: 13px;
      border-top: 1px solid var(--border-light);
    }

    @media (max-width: 560px) {
      header { padding: 12px 20px; }
      .logo img { height: 28px; }
    }
  </style>
</head>
<body>

  <!-- Header: logo on top-left -->
  <header>
    <a class="logo" href="#" aria-label="VODAR Home">
      <img src="logo.png" alt="VODAR" />
    </a>
  </header>

  <!-- Main Content -->
  <main>
    <h1>Our website is <span class="accent">coming soon</span></h1>

    <div class="bars" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <section class="contact">
      <h2>Leave us a message</h2>
      <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="86074a8d-b752-4081-a24e-59d75c4fd678" />
        <input type="hidden" name="subject" value="New message from vodar.net" />
        <input type="checkbox" name="botcheck" tabindex="-1" aria-hidden="true" style="display: none;" />
        <div class="field">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
        </div>
        <button type="submit" class="btn-send" id="btn-send">Send Message</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </section>
  </main>

  <footer>
    © 2026 VODAR. All rights reserved.
  </footer>

  <script>
    const form = document.getElementById('contact-form');
    const statusEl = document.getElementById('form-status');
    const sendBtn = document.getElementById('btn-send');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';
      statusEl.textContent = '';
      statusEl.className = 'form-status';
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form)
        });
        const data = await res.json();
        if (data.success) {
          form.reset();
          statusEl.textContent = 'Thank you! Your message has been sent.';
          statusEl.classList.add('success');
        } else {
          throw new Error(data.message || 'Submission failed');
        }
      } catch (err) {
        statusEl.textContent = 'Something went wrong. Please try again later.';
        statusEl.classList.add('error');
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send Message';
      }
    });
  </script>

</body>
</html>
